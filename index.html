<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akıllı Zil Ekranı</title>
    <!-- Eski iOS/iPad cihazlarda Ana Ekrana Eklendiğinde tam ekran açılması için -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background 1.5s cubic-bezier(0.4, 0, 0.2, 1), color 1.5s ease;
            color: #ffffff;
            background: #000000;
        }

        body.theme-class {
            background: #111827;
            background: radial-gradient(circle at center, #111827, #000000);
        }

        body.theme-break {
            background: #166534;
            background: radial-gradient(circle at center, #166534, #052e16);
        }

        body.theme-out {
            background: #000000;
            color: rgba(255, 255, 255, 0.15);
        }

        .container {
            text-align: center;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            padding-bottom: 10vh;
        }

        /* Tarih ve Gün Gösterimi */
        .date-container {
            font-size: 4vmin;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 3vh;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        body.theme-out .date-container {
            text-shadow: none;
            opacity: 0.5;
        }

        .clock {
            font-size: 32vmin;
            font-weight: 900;
            letter-spacing: -1px;
            font-variant-numeric: tabular-nums;
            margin-bottom: 2vh;
            line-height: 0.9;
            display: flex;
            align-items: baseline;
            justify-content: center;
            transition: color 1s ease, text-shadow 1s ease;
        }

        body.theme-class .clock {
            color: #ff4d4d;
            text-shadow: 0 10px 25px rgba(0, 0, 0, 1);
        }

        body.theme-break .clock {
            color: #4ade80;
            text-shadow: 0 10px 25px rgba(0, 0, 0, 1);
        }

        body.theme-out .clock {
            color: rgba(255, 255, 255, 0.2);
            text-shadow: none;
        }

        .seconds {
            font-size: 10vmin;
            font-weight: 700;
            margin-left: 1vmin;
            opacity: 0.9;
            letter-spacing: 0px;
        }

        .status {
            font-size: 12vmin;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 3vh;
            text-shadow: 0 8px 15px rgba(0, 0, 0, 0.8);
        }

        body.theme-out .status {
            font-weight: 500;
            font-size: 7vmin;
            letter-spacing: 8px;
            text-shadow: none;
        }

        .countdown-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        body.theme-out .countdown-container {
            opacity: 0;
            pointer-events: none;
            display: none;
        }

        .countdown-label {
            font-size: 4vmin;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 1vh;
        }

        .countdown {
            font-size: 20vmin;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            background: rgba(0, 0, 0, 0.6);
            padding: 0 7vw;
            border-radius: 999px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            line-height: 1.1;
            text-shadow: 0 8px 15px rgba(0, 0, 0, 0.8);
        }

        /* İlerleme Çubuğu Bölümü */
        .progress-section {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100vw;
            padding: 4vh 5vw;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7), transparent);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        body.theme-out .progress-section {
            display: none;
        }

        .progress-label {
            font-size: 2.5vmin;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 2vh;
            display: flex;
            justify-content: space-between;
        }

        .timeline {
            width: 100%;
            height: 2vmin;
            min-height: 14px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .progress {
            height: 100%;
            border-radius: 20px;
            width: 0%;
            transition: width 1s linear, background 1s ease;
        }

        body.theme-class .progress {
            background: #ef4444;
            background: linear-gradient(90deg, rgba(239, 68, 68, 0.4), #ef4444);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }

        body.theme-break .progress {
            background: #22c55e;
            background: linear-gradient(90deg, rgba(34, 197, 94, 0.4), #22c55e);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.5);
        }

        .alert-text {
            color: #ef4444 !important;
            animation: blinker 1s linear infinite;
            border-color: rgba(239, 68, 68, 0.3) !important;
        }

        @keyframes blinker {
            50% {
                opacity: 0.4;
            }
        }

        /* --- ACİL DUYURU ANİMASYONLARI --- */
        .announcement-bar {
            position: absolute;
            top: -20vh;
            left: 0;
            width: 100vw;
            background: #dc2626;
            background: linear-gradient(90deg, #dc2626, #991b1b, #dc2626);
            background-size: 200% 200%;
            animation: redAlertBlink 2s ease infinite;
            padding: 3vh 0;
            z-index: 1000;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9);
            transition: top 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            border-bottom: 6px solid #fca5a5;
            display: flex;
            align-items: center;
        }

        @keyframes redAlertBlink {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .announcement-bar.show {
            top: 0;
        }

        .marquee-container {
            display: inline-block;
            white-space: nowrap;
            /* Yavaşça akan sonsuz şerit animasyonu */
            animation: marqueeText 20s linear infinite;
        }

        @keyframes marqueeText {
            0% {
                transform: translateX(100vw);
            }

            100% {
                transform: translateX(-100%);
            }
        }

        .announcement-text {
            color: #ffffff;
            font-size: 7vmin;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 5px 20px rgba(0, 0, 0, 1);
            padding-right: 50vw;
        }

        /* --- Gizli Ayarlar Menüsü --- */
        .secret-button {
            position: absolute;
            top: 0;
            right: 0;
            width: 20vw;
            height: 20vh;
            z-index: 100;
        }

        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
            color: white;
            /* Older tablets don't support backdrop-filter but it gracefully degrades */
            backdrop-filter: blur(10px);
        }

        .settings-box {
            background: #1f2937;
            padding: 3rem;
            border-radius: 1.5rem;
            width: 90vw;
            max-width: 800px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-family: 'Outfit', sans-serif;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .settings-header h2 {
            font-size: 4vmin;
            margin: 0;
        }

        .close-btn {
            cursor: pointer;
            font-size: 4vmin;
            font-weight: bold;
            color: #ef4444;
        }

        .editor-labels {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
            font-size: 2.2vmin;
            color: #9ca3af;
            font-weight: 500;
            padding: 0 5px;
        }

        .editor-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
        }

        .editor-row input,
        .editor-row select {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #374151;
            color: white;
            font-size: 2.5vmin;
            font-family: inherit;
        }

        .editor-row input[type="time"] {
            flex: 1.2;
        }

        .editor-row input[type="text"] {
            flex: 2;
        }

        .editor-row select {
            flex: 1.5;
        }

        .btn-add {
            width: 100%;
            padding: 15px;
            margin-bottom: 25px;
            background: #4b5563;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 8px;
            font-size: 2.2vmin;
            font-family: inherit;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-add:hover {
            background: #6b7280;
        }

        .btn-container {
            display: flex;
            gap: 15px;
        }

        .btn-save {
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            background: #22c55e;
            color: white;
            font-weight: bold;
            font-size: 2.5vmin;
            font-family: inherit;
            cursor: pointer;
            transition: 0.2s;
            flex: 2;
        }

        .btn-save:hover {
            background: #16a34a;
        }

        .btn-reset {
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            background: #ef4444;
            color: white;
            font-weight: bold;
            font-size: 2.5vmin;
            font-family: inherit;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
        }

        .btn-reset:hover {
            background: #dc2626;
        }
    </style>
</head>

<body class="theme-out" id="body">

    <!-- ACİL DUYURU SİREN BARI (Yayın gelince inecektir) -->
    <div id="announcementBar" class="announcement-bar">
        <div class="marquee-container" id="marqueeSlide">
            <span id="announcementText" class="announcement-text"></span>
        </div>
    </div>

    <!-- Gizli Ayarlar Tıklama Alanı (Sağ Üst köşeye görünmez buton) -->
    <div class="secret-button" id="secretArea"></div>

    <!-- Ayarlar Modalı -->
    <div class="settings-overlay" id="settingsModal">
        <div class="settings-box">
            <div class="settings-header">
                <h2>Gizli Yönetim Paneli</h2>
                <div class="close-btn" onclick="closeSettings()">X</div>
            </div>
            <div class="editor-labels">
                <span style="flex:1.2">Başlangıç Saati</span>
                <span style="flex:2">Durum Adı</span>
                <span style="flex:1.5">Renk Teması</span>
                <span style="width: 4vmin;"></span>
            </div>

            <div id="scheduleEditor"></div>

            <button onclick="addRow()" class="btn-add">+ Yeni Saat Dilimi Ekle</button>

            <div class="btn-container">
                <button onclick="saveSchedule()" class="btn-save">Kaydet ve Uygula</button>
                <button onclick="resetSettings()" class="btn-reset">Varsayılana Dön</button>
            </div>
        </div>
    </div>

    <!-- ANA ARAYÜZ -->
    <div class="container" id="mainContainer">
        <!-- TARİH VE GÜN -->
        <div class="date-container" id="dateDisplay">Yükleniyor...</div>

        <!-- CANLI SAAT -->
        <div class="clock">
            <span id="timeMain">00:00</span><span class="seconds" id="timeSec">00</span>
        </div>

        <!-- ŞU ANKİ DURUM -->
        <div class="status" id="status">Yükleniyor...</div>

        <!-- GERİ SAYIM SAYACI -->
        <div class="countdown-container">
            <div class="countdown-label" id="countdownLabel">Kalan Süre</div>
            <div class="countdown" id="countdown">00:00</div>
        </div>
    </div>

    <!-- GELİŞMİŞ İLERLEME ÇUBUĞU (EN ALT) -->
    <div class="progress-section" id="progressSection">
        <div class="progress-label">
            <span id="progressTitle">Tamamlanma</span>
            <span id="progressText">%0</span>
        </div>
        <div class="timeline">
            <div class="progress" id="progress"></div>
        </div>
    </div>

    <script>
        // Orijinal (Varsayılan) Zaman Çizelgesi
        var defaultSchedule = [
            { time: "00:00", status: "Okul Dışı", type: "out" },
            { time: "08:30", status: "Ders", type: "class" },
            { time: "09:50", status: "Tenefüs", type: "break" },
            { time: "10:10", status: "Ders", type: "class" },
            { time: "11:30", status: "Tenefüs", type: "break" },
            { time: "11:40", status: "Ders", type: "class" },
            { time: "12:20", status: "Öğle Arası", type: "break" },
            { time: "13:20", status: "Ders", type: "class" },
            { time: "14:40", status: "Tenefüs", type: "break" },
            { time: "14:50", status: "Ders", type: "class" },
            { time: "16:10", status: "Tenefüs", type: "break" },
            { time: "16:20", status: "Ders", type: "class" },
            { time: "17:00", status: "Okul Dışı", type: "out" }
        ];

        var schedule = [];

        // --- İNTERNET SAATİ (ATOMİK YAKLAŞIM) SENKRONİZASYONU ---
        var timeOffset = 0; // Cihaz saati ile gerçek internet saati arasındaki milisaniye farkı

        function fetchInternetTime() {
            try {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', 'http://worldtimeapi.org/api/timezone/Europe/Istanbul', true);
                xhr.onreadystatechange = function () {
                    if (xhr.readyState === 4) {
                        if (xhr.status >= 200 && xhr.status < 300) {
                            try {
                                var data = JSON.parse(xhr.responseText);
                                var internetTime = new Date(data.datetime).getTime();
                                var localTime = new Date().getTime();
                                timeOffset = internetTime - localTime;
                                console.log("İnternet saatiyle %100 senkronize edildi. Lokal sapma: " + (timeOffset / 1000).toFixed(1) + " saniye.");
                            } catch (e) { }
                        } else {
                            console.log("İnternet saatine bağlanılamadı. Tabletin kendi iç saati kullanılıyor.");
                        }
                    }
                };
                xhr.send();
            } catch (err) {
                console.log("İnternet saatine bağlanılamadı. Hata: " + err);
            }
        }

        // Sayfa açıldığında internetten saati çek
        fetchInternetTime();

        // Tablet ekranı haftalarca açık kalabileceği için, her 1 saatte bir (3600000 ms) arka planda kendini yeniden senkronize eder
        setInterval(fetchInternetTime, 3600000);

        // Başlangıçta localStorage okuma
        function initSchedule() {
            var saved = localStorage.getItem('okulZilProgrami_v1');
            if (saved) {
                try {
                    schedule = JSON.parse(saved);
                } catch (e) {
                    schedule = JSON.parse(JSON.stringify(defaultSchedule));
                }
            } else {
                schedule = JSON.parse(JSON.stringify(defaultSchedule));
            }
        }
        initSchedule();

        // Tarih değişkenleri
        var aylar = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
        var gunler = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];

        function updateDateDisplay(now) {
            var dateStr = now.getDate() + " " + aylar[now.getMonth()] + " " + gunler[now.getDay()];
            var dateElem = document.getElementById('dateDisplay');
            if (dateElem.textContent !== dateStr) {
                dateElem.textContent = dateStr;
            }
        }

        function timeToMinutes(timeStr) {
            var parts = timeStr.split(':');
            var hours = parseInt(parts[0], 10);
            var minutes = parseInt(parts[1], 10);
            return hours * 60 + minutes;
        }

        function updateScreen() {
            // Sadece tablet saati değil, + internetten çekilen milisaniyelik hata payı (timeOffset) kullanılıyor
            var now = new Date(new Date().getTime() + timeOffset);
            updateDateDisplay(now);

            var h = now.getHours();
            var m = now.getMinutes();
            var s = now.getSeconds();

            var hoursStr = h < 10 ? '0' + h : '' + h;
            var minutesStr = m < 10 ? '0' + m : '' + m;
            var secondsStr = s < 10 ? '0' + s : '' + s;

            document.getElementById('timeMain').textContent = hoursStr + ":" + minutesStr;
            document.getElementById('timeSec').textContent = secondsStr;

            var currentMinutes = h * 60 + m;

            var currentPeriodIndex = 0;
            for (var i = 0; i < schedule.length; i++) {
                if (currentMinutes >= timeToMinutes(schedule[i].time)) {
                    currentPeriodIndex = i;
                } else {
                    break;
                }
            }

            var currentPeriod = schedule[currentPeriodIndex];
            var nextPeriod = currentPeriodIndex < schedule.length - 1 ? schedule[currentPeriodIndex + 1] : schedule[0];

            document.getElementById('status').textContent = currentPeriod.status;
            var body = document.getElementById('body');
            body.className = "theme-" + currentPeriod.type;

            if (currentPeriod.type !== 'out') {
                document.querySelector('.countdown-container').style.display = 'flex';

                if (currentPeriod.type === 'class') {
                    document.getElementById('progressTitle').textContent = "Dersin Tamamlanma Yüzdesi";
                } else if (currentPeriod.type === 'break') {
                    if (currentPeriod.status.toUpperCase().indexOf("ÖĞLE") !== -1) {
                        document.getElementById('progressTitle').textContent = "Öğle Arasının Tamamlanması";
                    } else {
                        document.getElementById('progressTitle').textContent = "Tenefüsün Tamamlanma Yüzdesi";
                    }
                }

                var periodStartMinutes = timeToMinutes(currentPeriod.time);
                var periodEndMinutes = timeToMinutes(nextPeriod.time);

                if (periodEndMinutes <= periodStartMinutes) {
                    periodEndMinutes += 24 * 60;
                }

                var totalPeriodMinutes = periodEndMinutes - periodStartMinutes;
                var elapsedMinutes = currentMinutes - periodStartMinutes;
                var remainingMinutes = periodEndMinutes - currentMinutes - 1;
                var remainingSeconds = 59 - s;

                var totalSeconds = totalPeriodMinutes * 60;
                var elapsedTotalSeconds = (elapsedMinutes * 60) + s;

                var progressPercent = (elapsedTotalSeconds / totalSeconds) * 100;

                if (progressPercent < 0) progressPercent = 0;
                if (progressPercent > 100) progressPercent = 100;

                document.getElementById('progress').style.width = progressPercent + "%";
                document.getElementById('progressText').textContent = "%" + Math.floor(progressPercent);

                var rmStr = remainingMinutes < 10 ? '0' + remainingMinutes : '' + remainingMinutes;
                var rsStr = remainingSeconds < 10 ? '0' + remainingSeconds : '' + remainingSeconds;

                var countdownElement = document.getElementById('countdown');
                countdownElement.textContent = rmStr + ":" + rsStr;

                if (remainingMinutes === 0) {
                    if (countdownElement.className.indexOf('alert-text') === -1) {
                        countdownElement.className += " alert-text";
                    }
                    document.getElementById('countdownLabel').textContent = "SON SANİYELER!";
                    document.getElementById('countdownLabel').style.color = "#ef4444";
                } else {
                    countdownElement.className = countdownElement.className.replace(" alert-text", "");
                    document.getElementById('countdownLabel').textContent = "KALAN SÜRE";
                    document.getElementById('countdownLabel').style.color = "rgba(255, 255, 255, 0.7)";
                }
            } else {
                // Okul Dışı durumu için
                document.querySelector('.countdown-container').style.display = 'none';
            }
        }

        // --- TAM EKRAN VE GÖRÜNMEZ WAKE LOCK MANTIĞI ---
        var wakeLock = null;
        var featuresEnabled = false;
        var noSleepVideo = null;

        function enablePremiumFeatures() {
            var isFullscreen = document.fullscreenElement || document.mozFullScreenElement || document.webkitFullscreenElement || document.msFullscreenElement;

            // 1. Ekranın UYKUYA GECMESİNİ ASLA ENGELLE (Wake Lock API)
            try {
                if (navigator.wakeLock && navigator.wakeLock.request) {
                    navigator.wakeLock.request('screen').then(function (lock) {
                        wakeLock = lock;
                    }).catch(function (err) { });
                }
            } catch (err) { }

            // 1.5. Eski Cihazlar İçin Görünmez Video Hack (Cihaz video izlendiğini sanır ve ekranı kapatmaz)
            try {
                if (!noSleepVideo) {
                    noSleepVideo = document.createElement('video');
                    noSleepVideo.setAttribute('playsinline', '');
                    noSleepVideo.muted = true;
                    noSleepVideo.loop = true;

                    noSleepVideo.style.zIndex = '9999';

            try {

        // Program açılışında anında tam ekran yapmayı dener (Tarayıcı kiosk izinleriyle hemen geçer)
        window.addEventListener('load', enablePremiumFeatures);

        // Standart cihazlarda tarayıcı oto-fullekranı engellerse; tablette ekrana yapacagınız İLK TEMASTA gizlice geçer. 
        document.addEventListener('click', enablePremiumFeatures);
        document.addEventListener('touchstart', enablePremiumFeatures);

        // Cihaz kilitlenip açılırsa ekran kilidini tekrar sağlama al
        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible' && navigator.wakeLock) {
                navigator.wakeLock.request('screen').then(function (lock) { wakeLock = lock; }).catch(function () { });
            }
        });

        // EKRAN ASLA KAPANMASIN: Her 30 saniyede bir ekran kapanmasın kilidini tazeler
        var lastVideoTime = -1;
        setInterval(function () {
            if (featuresEnabled && document.visibilityState === 'visible' && navigator.wakeLock) {
                navigator.wakeLock.request('screen').then(function (lock) { wakeLock = lock; }).catch(function () { });
            }
            // Videonun devam ettiğinden emin ol (Android 7 gibi eski cihazlarda videonun durmasını engeller)
            if (featuresEnabled && noSleepVideo) {
                if (noSleepVideo.paused || noSleepVideo.currentTime === lastVideoTime) {
                    var p = noSleepVideo.play();
                    if (p !== undefined) { p.catch(function (e) { }); }
                }
                lastVideoTime = noSleepVideo.currentTime;
            }
        }, 30000);

        // --- GİZLİ MENÜ MANTIĞI (7 TIKLAMA) ---
        var tapCount = 0;
        var tapTimeout;
        document.getElementById('secretArea').addEventListener('click', function (e) {
            tapCount++;
            clearTimeout(tapTimeout);

            if (tapCount >= 7) {
                tapCount = 0;
                openSettings();
            } else {
                tapTimeout = setTimeout(function () { tapCount = 0; }, 2000);
            }
        });

        // --- AYARLAR YÖNETİMİ ---
        function openSettings() {
            document.getElementById('settingsModal').style.display = 'flex';
            renderEditor();
        }

        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        function renderEditor() {
            var container = document.getElementById('scheduleEditor');
            container.innerHTML = '';
            for (var i = 0; i < schedule.length; i++) {
                (function (index) {
                    var item = schedule[index];
                    var div = document.createElement('div');
                    div.className = 'editor-row';

                    var selClass = item.type === 'class' ? 'selected' : '';
                    var selBreak = item.type === 'break' ? 'selected' : '';
                    var selOut = item.type === 'out' ? 'selected' : '';

                    div.innerHTML =
                        '<input type="time" value="' + item.time + '" id="time_' + index + '" required>' +
                        '<input type="text" value="' + item.status + '" id="status_' + index + '" required>' +
                        '<select id="type_' + index + '">' +
                        '<option value="class" ' + selClass + '>Ders (Kırmızı)</option>' +
                        '<option value="break" ' + selBreak + '>Zil/Tenefüs (Yeşil)</option>' +
                        '<option value="out" ' + selOut + '>Okul Dışı (Siyah)</option>' +
                        '</select>' +
                        '<div onclick="deleteRow(' + index + ')" style="font-size:3vmin; cursor:pointer; width:4vmin; text-align:center; color:#ef4444; font-weight:bold;" title="Sil">X</div>';

                    container.appendChild(div);
                })(i);
            }
        }

        function addRow() {
            schedule.push({ time: "00:00", status: "Yeni Kayıt", type: "class" });
            renderEditor();
        }

        function deleteRow(index) {
            schedule.splice(index, 1);
            renderEditor();
        }

        function saveSchedule() {
            var newSchedule = [];
            for (var i = 0; i < schedule.length; i++) {
                var time = document.getElementById('time_' + i).value;
                var status = document.getElementById('status_' + i).value;
                var type = document.getElementById('type_' + i).value;

                if (time && status) {
                    newSchedule.push({ time: time, status: status, type: type });
                }
            }

            // Saatleri kronolojik sıraya dizelim
            newSchedule.sort(function (a, b) {
                return timeToMinutes(a.time) - timeToMinutes(b.time);
            });

            schedule = newSchedule;
            localStorage.setItem('okulZilProgrami_v1', JSON.stringify(schedule));
            closeSettings();
            updateScreen();
            alert("Yeni program hafızaya kaydedildi!");
        }

        function resetSettings() {
            if (confirm("Bütün özel ayarlarınız silinip fabrika programına dönülecek. Emin misiniz?")) {
                schedule = JSON.parse(JSON.stringify(defaultSchedule));
                localStorage.removeItem('okulZilProgrami_v1');
                renderEditor();
                updateScreen();
            }
        }

        // --- CİHAZ KİMLİĞİ (ONAY İÇİN) ---
        var cihazId = localStorage.getItem('okul_tablet_id_v1');
        if (!cihazId) {
            cihazId = 'TAB-' + Math.floor(Math.random() * 900000 + 100000);
            localStorage.setItem('okul_tablet_id_v1', cihazId);
        }

        // --- İNTERNET ÜZERİNDEN CANLI DUYURU ALICISI ---
        var DUYURU_KANALI = "taha_okul_duyuru_xtz123";
        var ONAY_KANALI = "taha_okul_onay_xtz123";
        var duyuruZamanlayici;

        function connectToGlobalAnnouncements() {
            if (typeof EventSource !== "undefined") {
                var sseConnection = new EventSource("http://ntfy.sh/" + DUYURU_KANALI + "/sse");

                sseConnection.onmessage = function (event) {
                    var veriler = JSON.parse(event.data);
                    // Sadece yeni bir bildirim paketlendiğinde tepki ver
                    if (veriler.event === "message" && veriler.message) {
                        try {
                            var paket = JSON.parse(veriler.message);

                            // 1. ACİL DUYURU GELDİYSE
                            if (paket.aksiyon === "duyuru") {
                                showEmergencyAnnouncement(paket.metin);
                                // Merkeze başarıyla alındığına dair ping gönder
                                var xhr = new XMLHttpRequest();
                                xhr.open("POST", "http://ntfy.sh/" + ONAY_KANALI, true);
                                xhr.send(JSON.stringify({ id: cihazId, tur: "duyuru_tamam" }));
                            }
                            // 2. YENİ SAAT (ZİL PROGRAMI) GELDİYSE
                            else if (paket.aksiyon === "program_guncelle") {
                                schedule = paket.yeniProgram;

                                // Doğru kronolojik sıraya diz ve kaydet
                                schedule.sort(function (a, b) {
                                    return timeToMinutes(a.time) - timeToMinutes(b.time);
                                });
                                localStorage.setItem('okulZilProgrami_v1', JSON.stringify(schedule));

                                // Görünümü tazele
                                renderEditor();
                                updateScreen();

                                // Merkeze başarıyla ulaştığına dair ping yolla
                                var xhr2 = new XMLHttpRequest();
                                xhr2.open("POST", "http://ntfy.sh/" + ONAY_KANALI, true);
                                xhr2.send(JSON.stringify({ id: cihazId, tur: "program_tamam" }));
                            }
                        } catch (e) {
                            // Düz json olmayan metin gelirse (eski sistem) yansıt
                            showEmergencyAnnouncement(veriler.message);
                        }
                    }
                };

                sseConnection.onerror = function (err) {
                    console.log("Duyuru yayıncı antenle bağlantı kesildi, tekrar aranıyor...");
                };
            } else {
                console.log("Tarayıcınız EventSource desteklemiyor. Canlı duyurular çalışmayabilir.");
            }
        }

        function showEmergencyAnnouncement(mesaj) {
            var bar = document.getElementById('announcementBar');
            var pText = document.getElementById('announcementText');

            // Metnin arasına işaretler ve boşluk koyarak ekranı sonsuz doldurması sağlanır
            var formatedText = "::: " + mesaj + " :::        ::: " + mesaj + " :::        ::: " + mesaj + " :::";
            pText.textContent = formatedText;

            // Animasyonu sıfırlamak ve baştan akmasını sağlamak
            var marqueeSlide = document.getElementById('marqueeSlide');
            marqueeSlide.style.animation = 'none';
            marqueeSlide.offsetHeight;
            marqueeSlide.style.animation = null;

            // Yukarıdan zımba gibi in
            if (bar.className.indexOf('show') === -1) {
                bar.className += " show";
            }

            clearTimeout(duyuruZamanlayici);

            // Tam 30 Saniye boyunca ekranda şeritte akar, sonra kapanır
            duyuruZamanlayici = setTimeout(function () {
                bar.className = bar.className.replace(" show", "");
            }, 30000);
        }

        connectToGlobalAnnouncements();

        // Başlangıç tetiklemesi
        setInterval(updateScreen, 1000);
        updateScreen(); 
    </script>
